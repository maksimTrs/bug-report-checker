# T0.6 spike: can a free GitHub-hosted runner install and run Laya on CPU? Manual, throwaway.
name: Spike - Laya on CPU runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false # cold install is what we measure

      - name: Runner resources
        run: |
          nproc
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Install dependencies (cold)
        run: |
          start=$(date +%s)
          uv sync --frozen --no-dev
          echo "Install: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh .venv .uv-cache | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Laya
        run: uv run --no-sync python scripts/spike_laya_runner.py

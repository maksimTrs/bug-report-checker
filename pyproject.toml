[project]
name = "bug-report-checker"
version = "0.1.0"
description = "Checks whether a bug report is complete and comments with what is missing."
authors = [
    { name = "Maksim T", email = "maksimtrsv1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "laya>=0.4.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Keep everything inside the project: no shared cache, no Python downloads into the user profile.
cache-dir = ".uv-cache"
python-preference = "only-system"
# `data` holds dataset tooling (pymongo's bson); the Action runtime installs without it.
default-groups = ["dev", "data"]

# CPU-only torch everywhere: PyPI ships CUDA builds on Linux (GitHub runners), several GB we never use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
data = [
    "pymongo>=4.18.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

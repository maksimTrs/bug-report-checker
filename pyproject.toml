[project]
name = "bug-report-checker"
version = "0.1.0"
description = "Checks whether a bug report is complete and comments with what is missing."
authors = [
    { name = "Maksim T", email = "maksimtrsv1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Keep everything inside the project: no shared cache, no Python downloads into the user profile.
cache-dir = ".uv-cache"
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
